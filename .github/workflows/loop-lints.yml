name: loop-lints
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-tests
        run: |
          python3 tools/server_closer_lint.py --selftest
          python3 tools/self_closed_lint.py --selftest
      - name: Server-side closer lint (DIR-1)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 tools/server_closer_lint.py --base origin/${{ github.base_ref }}
          else
            python3 tools/server_closer_lint.py --no-diff
          fi
      - name: Self-closed loops lint (SELF-CLOSED-LOOPS-1)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 tools/self_closed_lint.py --base origin/${{ github.base_ref }}
          else
            python3 tools/self_closed_lint.py --no-diff
          fi
